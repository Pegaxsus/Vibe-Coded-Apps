<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metadata Cleaner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="shell.js" defer></script>
  <script src="metadata.js" defer></script>
  <script src="tool.js" defer></script>
</head>
<body data-theme="light">
  <!-- INICIO HEADER COMÚN: reutilizar con styles.css y shell.js -->
  <header class="app-header">
    <h1 data-i18n="toolTitle">Metadata Cleaner</h1>
    <div class="header-controls">
      <div class="icon-group" role="group" data-i18n-aria="languageGroup" aria-label="Idioma">
        <button class="icon-button" type="button" data-language="es" aria-label="Español" title="Español" aria-pressed="true">
          <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="2" y="3" width="28" height="18" rx="2"/><path d="M2 8h28M2 16h28"/><path d="M10 10v4c0 2 4 2 4 0v-4zM10 12h4"/></svg>
        </button>
        <button class="icon-button" type="button" data-language="en" aria-label="English" title="English" aria-pressed="false">
          <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="2" y="3" width="28" height="18" rx="2"/><path d="m3 4 26 16M29 4 3 20M16 3v18M2 12h28"/><path d="M13 3v6H2m28 0H19V3M2 15h11v6m6 0v-6h11"/></svg>
        </button>
      </div>
      <span class="control-divider" aria-hidden="true"></span>
      <div class="icon-group" role="group" data-i18n-aria="themeGroup" aria-label="Tema">
        <button class="icon-button" type="button" data-theme-choice="light" data-i18n-aria="lightTheme" aria-label="Tema claro" title="Tema claro" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
        <button class="icon-button" type="button" data-theme-choice="dark" data-i18n-aria="darkTheme" aria-label="Tema oscuro" title="Tema oscuro" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.7 8.7 0 0 1 10 3.5 8.7 8.7 0 1 0 20.5 14Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <!-- FIN HEADER COMÚN -->

  <main class="workspace">
    <!-- INICIO MÓDULO HERRAMIENTA: sustituir este section; lógica en tool.js -->
    <section id="tool-root" class="tool-module" aria-labelledby="module-title">
      <div class="intro"><div><h2 id="module-title" data-i18n="moduleTitle">Carga ficheros para mostrar su contenido</h2><p class="module-description" data-i18n="moduleDescription">Esta app funciona sólo en tu navegador.</p></div></div>
      <details id="upload-panel" class="upload-panel" open>
        <summary><span data-i18n="uploadPanel">Carga de archivos</span><span class="formats">JPG · PNG · WebP · TXT</span></summary>
      <button id="drop" class="drop" type="button"><span class="upload-icon" aria-hidden="true">↥</span><strong data-i18n="drop">Arrastra uno o varios archivos aquí</strong><span data-i18n="browse">o pulsa para explorar tu equipo</span><small data-i18n="limits">Hasta 50 MB por archivo · 200 MB por lote · 50 archivos</small></button>
      <input id="picker" type="file" accept=".jpg,.jpeg,.png,.webp,.txt" multiple hidden>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="results" hidden>
        <div class="results-heading"><h3 data-i18n="uploaded">Archivos cargados</h3></div>
        <aside id="files" aria-label="Archivos"></aside>
        <div class="results-heading"><h3 data-i18n="review">Lista de metadatos: </h3></div>
        <section class="inspection"><div class="inspection-header"><div id="file-heading"></div><div class="selection-bar"><button id="all" class="text-button" data-i18n="all">Marcar todo</button><button id="none" class="text-button" data-i18n="none">Desmarcar todo</button><button id="apply" class="text-button" data-i18n="apply">Aplicar categorías al lote</button></div></div><div id="categories"></div><div id="notes" class="notes"></div></section>
        <div class="download-bar"><div><strong id="selection-summary"></strong><p data-i18n="copy">Se descarga una copia con la misma extensión. El original no se modifica.</p></div><div class="actions"><button id="download-one" class="secondary" data-i18n="download">Limpiar las categorías marcadas</button><button id="download-batch" class="secondary" data-i18n="downloadBatch">Descargar lote .zip</button><button id="delete-download" class="primary" data-i18n="deleteDownload">Eliminar todos los metadatos y descargar</button></div></div>
      </div>
      <div id="reset-bar" class="reset-bar" hidden><button id="clear" class="danger" data-i18n="clear" disabled>Limpiar app</button></div>
    </section>
    <!-- FIN MÓDULO HERRAMIENTA -->
  </main>
</body>
</html>
