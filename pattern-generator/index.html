<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pattern Generator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-theme="dark">
    <header class="app-header">
      <div>
        <p class="eyebrow">Offline pattern studio</p>
        <h1>Pattern Generator</h1>
      </div>

      <label class="theme-control">
        <span>Theme</span>
        <select id="themeSelect" aria-label="Choose theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
    </header>

    <main class="workspace">
      <section class="preview-panel" aria-label="Pattern preview">
        <div class="canvas-shell">
          <canvas id="patternCanvas" width="1600" height="1100"></canvas>
          <div id="emptyState" class="empty-state">
            <strong>Drop a reference image</strong>
            <span>The generated pattern will appear here.</span>
            <label class="file-picker">
              <input id="imageInput" type="file" accept="image/*">
              <span>Upload image</span>
            </label>
            <p id="fileName" class="file-name">No image selected</p>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="Generator controls">
        <details class="control-group" open>
          <summary>Orientation</summary>
          <label>
            <span>Rotation <output id="rotationValue">0 deg</output></span>
            <input id="rotation" type="range" min="-180" max="180" value="0">
          </label>
          <label>
            <span>Scale <output id="scaleValue">70%</output></span>
            <input id="scale" type="range" min="15" max="220" value="70">
          </label>
          <label>
            <span>Skew X <output id="skewXValue">0 deg</output></span>
            <input id="skewX" type="range" min="-45" max="45" value="0">
          </label>
          <label>
            <span>Skew Y <output id="skewYValue">0 deg</output></span>
            <input id="skewY" type="range" min="-45" max="45" value="0">
          </label>
        </details>

        <details class="control-group" open>
          <summary>Pattern</summary>
          <label>
            <span>Spacing X <output id="gapXValue">190 px</output></span>
            <input id="gapX" type="range" min="40" max="520" value="190">
          </label>
          <label>
            <span>Spacing Y <output id="gapYValue">190 px</output></span>
            <input id="gapY" type="range" min="40" max="520" value="190">
          </label>
          <label>
            <span>Row offset <output id="rowOffsetValue">50%</output></span>
            <input id="rowOffset" type="range" min="-100" max="100" value="50">
          </label>
          <label>
            <span>Density <output id="densityValue">3</output></span>
            <input id="density" type="range" min="1" max="6" value="3">
          </label>
        </details>

        <details class="control-group" open>
          <summary>Color</summary>
          <div class="color-row">
            <label>
              <span>Pattern</span>
              <input id="patternColor" type="color" value="#2f7dff">
            </label>
            <label>
              <span>Background</span>
              <input id="backgroundColor" type="color" value="#10131b">
            </label>
          </div>
          <label class="check-row">
            <input id="transparentBg" type="checkbox">
            <span>Transparent background</span>
          </label>
          <label>
            <span>Opacity <output id="opacityValue">100%</output></span>
            <input id="opacity" type="range" min="5" max="100" value="100">
          </label>
        </details>

        <details class="control-group" open>
          <summary>Halo</summary>
          <label>
            <span>Size <output id="haloSizeValue">0 px</output></span>
            <input id="haloSize" type="range" min="0" max="90" value="0">
          </label>
          <label>
            <span>Softness <output id="haloSoftnessValue">8 px</output></span>
            <input id="haloSoftness" type="range" min="0" max="36" value="8">
          </label>
        </details>

        <section class="download-row">
          <button id="downloadPng" type="button">Download PNG</button>
          <button id="downloadSvg" type="button">Download SVG</button>
          <button id="clearPreview" class="danger-button" type="button">Clear Preview</button>
        </section>

        <footer class="credits" aria-label="Project attribution">
          <span>U/PEGAXSUS</span>
          <span>Made with CODEX</span>
          <img id="licenseImage" src="assets/license.png" alt="Project license">
        </footer>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
